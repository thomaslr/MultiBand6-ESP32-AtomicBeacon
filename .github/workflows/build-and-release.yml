name: Build & Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'firmware-rust/**'
      - 'data/**'
  pull_request:
    paths:
      - 'firmware-rust/**'
      - 'data/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag/version name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write
  packages: read

concurrency:
  group: firmware-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build ESP32-C3 Firmware Binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/plant-esp32-build:2026-11-05
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware-rust -> target
          cache-on-failure: true

      - name: Cache ESP-IDF Tools (.espressif)
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            firmware-rust/.embuild
          key: esp-idf-${{ runner.os }}-${{ hashFiles('firmware-rust/Cargo.lock') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-

      - name: Run Core Protocols Unit Tests
        run: cargo test --package beacon-core --target x86_64-unknown-linux-gnu
        working-directory: firmware-rust

      - name: Compile Release Firmware
        working-directory: firmware-rust/beacon-firmware
        run: cargo build --release

      - name: Convert ELF to Flashable Firmware Binaries (.bin)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # 1. Standalone application binary for OTA updates
          espflash save-image --chip esp32c3 \
            --partition-table firmware-rust/beacon-firmware/partitions.csv \
            firmware-rust/target/riscv32imc-esp-espidf/release/beacon-firmware \
            multiband6-beacon.bin
          
          # 2. Merged factory binary for initial USB flashing at address 0x0 (includes bootloader + Dual-OTA partitions)
          espflash save-image --merge --skip-padding --chip esp32c3 \
            --partition-table firmware-rust/beacon-firmware/partitions.csv \
            firmware-rust/target/riscv32imc-esp-espidf/release/beacon-firmware \
            multiband6-beacon-factory.bin

          BIN_SIZE=$(wc -c < multiband6-beacon.bin | tr -d ' ')
          MAX_SIZE=2031616
          PCT=$(( BIN_SIZE * 100 / MAX_SIZE ))
          echo "Firmware Binary Size: $BIN_SIZE bytes ($PCT% of $MAX_SIZE byte OTA slot)"
          if [ "$BIN_SIZE" -gt 1930035 ]; then
            echo "::warning::Firmware binary is at ${PCT}% capacity (>95%). Size optimizations recommended."
          fi
          if [ "$BIN_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Firmware binary ($BIN_SIZE bytes) exceeds maximum OTA slot limit ($MAX_SIZE bytes)!"
            exit 1
          fi
          ls -lh multiband6-beacon.bin multiband6-beacon-factory.bin

      - name: Generate Version Metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag || 'latest' }}"
          fi
          cat <<EOF > version.json
          {
            "version": "$TAG_NAME",
            "url": "https://github.com/${{ github.repository }}/releases/latest/download/multiband6-beacon.bin",
            "sha256": "$(sha256sum multiband6-beacon.bin | awk '{print $1}')",
            "factory_url": "https://github.com/${{ github.repository }}/releases/latest/download/multiband6-beacon-factory.bin",
            "factory_sha256": "$(sha256sum multiband6-beacon-factory.bin | awk '{print $1}')",
            "built_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat version.json

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG_RAW="${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'latest' }}"
          VERSION="${TAG_RAW#v}"
          python3 -c "
          import re, os
          version = '$VERSION'
          notes = ''
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          if not notes:
              notes = 'Rust-only firmware with Dual-OTA partitioning, Wi-Fi provisioning portal, and web network settings.'
          repo = '${{ github.repository }}'
          tag = '$TAG_RAW'
          notes += f'\n\n### 🔗 Full Changelog\n- [View git commit comparison and diffs](https://github.com/{repo}/releases/tag/{tag})'
          with open('release_notes.md', 'w') as out:
              out.write(notes + '\n')
          "
          cat release_notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'latest' }}
          name: MultiBand 6 Beacon Firmware ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'latest' }}
          body_path: release_notes.md
          files: |
            multiband6-beacon.bin
            multiband6-beacon-factory.bin
            version.json
