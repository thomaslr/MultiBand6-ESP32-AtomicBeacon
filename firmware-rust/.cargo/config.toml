[build]
target = "riscv32imc-esp-espidf"

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --partition-table beacon-firmware/partitions.csv --monitor"

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c3"
ESP_IDF_SYS_ROOT_CRATE = "beacon-firmware"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "beacon-firmware/sdkconfig.defaults", relative = true }
ESP_IDF_TOOLS_INSTALL_DIR = { value = "global" }
